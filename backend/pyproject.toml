[project]
name = "appeal-agent"
version = "0.1.0"
description = "AI agent that drafts health insurance appeals with policy citations"
authors = [
    { name = "ShivamSpm", email = "spmshivam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter handles line length; prompts are long strings
