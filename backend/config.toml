# Model and provider settings. Secrets live in the repo-root .env, never here.
# Any [models] value can be overridden with an env var, e.g. APPEAL_MODEL_AGENT.

[llm]
base_url = "https://api.inference.crusoecloud.com/v1/"
api_key_env = "CRUSOE_API_KEY"
max_retries = 5       # provider errors (429, 5xx, network), with exponential backoff

[models]
agent = "deepseek-ai/DeepSeek-V4-Pro"
agent_cheap = "deepseek-ai/DeepSeek-V4.1-Flash"
dataset_writer = "deepseek-ai/DeepSeek-V4.1-Flash"

[agent]
max_steps = 25        # LLM calls per run
max_retries = 2       # consecutive malformed or invalid tool-call turns allowed
temperature = 0
max_tokens = 8000     # per LLM call; reasoning tokens count toward it
search_top_k = 4

[evals]
repeats = 3           # passes per case
concurrency = 4       # cases run in parallel
reports_dir = "evals/reports"   # relative to the repo root; committed

[storage]
db_path = "backend/runs.db"   # relative to the repo root; gitignored
user_cases_dir = "data/user_cases"   # cases created in the UI; relative to the repo root; gitignored

[api]
# Origins allowed to call the API from a browser. Override with APPEAL_CORS_ORIGINS (comma-separated).
cors_origins = ["http://localhost:3000"]
live_runs = true      # allow starting live (paid) runs; a password gate comes with deployment on Day 7
run_workers = 2       # live runs executed at the same time
poll_s = 0.3          # how often the event stream checks SQLite for new steps
stale_after_s = 600   # a running run with no new step for this long is reported as stalled
replay_max_step_s = 3.0   # longest pause between steps when replaying at 1x

# USD per 1M tokens. Source: https://www.crusoe.ai/cloud/pricing (Serverless
# Inference), read 2026-10-21. Check against the Crusoe console.
