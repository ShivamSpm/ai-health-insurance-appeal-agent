# Model and provider settings. Secrets live in the repo-root .env, never here.
# Any [models] value can be overridden with an env var, e.g. APPEAL_MODEL_AGENT.

[llm]
base_url = "https://api.inference.crusoecloud.com/v1/"
api_key_env = "CRUSOE_API_KEY"

[models]
agent = "deepseek-ai/DeepSeek-V4-Pro"
agent_cheap = "deepseek-ai/DeepSeek-V4.1-Flash"
dataset_writer = "deepseek-ai/DeepSeek-V4.1-Flash"

[agent]
max_steps = 25        # LLM calls per run
max_retries = 2       # consecutive malformed or invalid tool-call turns allowed
temperature = 0
max_tokens = 8000     # per LLM call; reasoning tokens count toward it
search_top_k = 4

[storage]
db_path = "backend/runs.db"   # relative to the repo root; gitignored

# USD per 1M tokens. Source: https://www.crusoe.ai/cloud/pricing (Serverless
# Inference), read 2026-10-21. Check against the Crusoe console.
[pricing."deepseek-ai/DeepSeek-V4-Pro"]
input = 1.74
output = 3.48
